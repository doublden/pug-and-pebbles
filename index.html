<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#27251f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Мопс">
<meta name="description" content="Мопс и камушки: маленькая лапа, бесконечные большие планы. Копай, улучшай инструменты и обустрой жизнь своего мопса.">
<title>Мопс и камушки</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
<script src="game.js" defer></script><script src="icons.js" defer></script><script src="audio.js" defer></script><script src="sprites.js" defer></script><script src="world.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<main id="app" class="app-shell">
 <canvas id="world" tabindex="0" role="button" aria-label="Копать камушки"></canvas>
 <div class="shade" aria-hidden="true"></div>
 <header class="hud"><div class="wallet"><span class="kibble" aria-hidden="true"></span><div><strong id="balance">0</strong><span id="wallet-label">камушки</span></div></div><button id="settings-open" class="round-button" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.7 2.2-2 .9-2.1-.6-2 3.5 1.6 1.7v2.6L3.2 15l2 3.5 2.1-.6 2 .9L10 21h4l.7-2.2 2-.9 2.1.6 2-3.5-1.6-1.7v-2.6l1.6-1.7-2-3.5-2.1.6-2-.9L14 3z"/><circle cx="12" cy="12" r="3.2"/></svg></button></header>
 <div class="bonus-indicator" id="bonus-indicator" hidden><span>×3</span><span id="bonus-seconds">30</span></div>
 <button class="golden-kibble" id="golden-kibble" hidden aria-label="Золотой камушек: временная добыча втрое"><span aria-hidden="true">✦</span></button>
 <p class="tap-hint" id="tap-hint">Нажимай на камушки</p>
 <div class="bottom-hud"><div class="scene-labels"><span id="pug-label">Чумазый мопс</span><span id="home-label">Свалка</span></div><div class="bottom-actions"><div class="equipped"><span id="equipped-icon" aria-hidden="true"></span><div><span id="equipped-name">Лапа</span><strong id="click-power">+1</strong></div></div><button id="shop-open" class="shop-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4zM8 8V6a4 4 0 0 1 8 0v2"/></svg><span id="shop-open-label">Магазин</span><span class="shop-dot" id="shop-dot" hidden></span></button></div></div>
 <div class="loading" id="loading"><span class="loading-paw" aria-hidden="true">✦</span><strong id="loading-title">Мопс уже на пути</strong><span id="loading-detail">Готовим камушки…</span></div>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<dialog id="shop-dialog" class="sheet shop-sheet" aria-labelledby="shop-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><div><span class="sheet-eyebrow" id="shop-eyebrow">ДЛЯ БОЛЬШИХ ПЛАНОВ</span><h1 id="shop-title">Магазин</h1></div><button class="close-button" id="shop-close" aria-label="Закрыть">×</button></header><div class="shop-wallet"><span class="kibble tiny" aria-hidden="true"></span><strong id="shop-balance">0</strong><span id="shop-currency">камушки</span></div><nav class="shop-tabs" aria-label="Разделы магазина"><button data-tab="tools" class="selected" aria-pressed="true" id="tab-tools">Инструменты</button><button data-tab="pug" aria-pressed="false" id="tab-pug">Мопс</button><button data-tab="home" aria-pressed="false" id="tab-home">Дом</button></nav><div class="shop-content" id="shop-content"></div><p class="shop-footnote" id="shop-footnote">Каждые 25 уровней инструмента — двойная сила</p><div class="save-note" id="save-note">Прогресс сохраняется на этом устройстве</div></dialog>
<dialog id="settings-dialog" class="sheet settings-sheet" aria-labelledby="settings-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h1 id="settings-title">Настройки</h1><button class="close-button" id="settings-close" aria-label="Закрыть">×</button></header><div class="setting-row"><label id="language-label" for="language">Язык</label><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></div><div class="setting-row"><label id="music-label" for="music-toggle">Музыка</label><input class="switch" id="music-toggle" type="checkbox" role="switch"></div><div class="setting-row"><label id="effects-label" for="effects-toggle">Звуки</label><input class="switch" id="effects-toggle" type="checkbox" role="switch" checked></div><p id="settings-save-note" class="settings-note">Всё сохраняется автоматически</p></dialog>
</body>
</html>
